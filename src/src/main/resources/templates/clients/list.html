<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Управление клиентами</title>
</head>
<body>
<h1>Список клиентов</h1>
<a href="/admin/clients/new">Создать клиента</a> |
<a href="/admin/managers">Менеджеры</a>

<table border="1" cellpadding="5">
    <thead>
    <tr>
        <th>ID</th>
        <th>Имя</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="client : ${clients}">
        <td th:text="${client.id}">1</td>
        <td th:text="${client.name}">Иван Иванов</td>
    </tr>
    <tr th:if="${clients.empty}">
        <td colspan="2">Список пуст</td>
    </tr>
    </tbody>
</table>
</body>
</html>
